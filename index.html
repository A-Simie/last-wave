<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="%BASE_URL%assets/pumpkin-icon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Last Wave — an autumn mystery. An ordinary afternoon at Tideline is only the beginning."
        />
        <title>Last Wave | The Last Normal Day</title>
    </head>
    <body>
        <canvas
            id="application-canvas"
            inert
            tabindex="0"
            aria-label="Last Wave game. Controls are listed on screen."
        ></canvas>
        <div id="startup-status">
            <img
                class="startup-brand"
                src="%BASE_URL%assets/last-wave-logo.svg"
                alt="Last Wave"
                width="300"
                height="86"
            />
            <span class="loading-ring" aria-hidden="true"></span>
            <p id="startup-message" role="status">Entering the forest…</p>
            <button id="retry-startup" type="button" hidden>Retry</button>
            <p class="startup-hint">
                The forest is loading. Sound and dialogue begin when your browser allows playback.
            </p>
            <noscript>Enable JavaScript to launch Last Wave.</noscript>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
